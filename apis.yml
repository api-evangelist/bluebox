name: Bluebox
description: Bluebox (Bluebox Security) was an enterprise mobile and application security
  startup founded around 2012 that let organizations secure corporate data on employee-owned
  smartphones and tablets without managing the whole device. It raised roughly $27.5M, with
  Andreessen Horowitz (a16z) leading its Series A and returning for the Series B alongside
  Tenaya Capital, Andreas Bechtolsheim, and SV Angel. Its technology assets were acquired by
  Lookout on April 8, 2016, after which Bluebox ceased operating as an independent company.
  It was a packaged security product vendor, not a public API provider, and it maintains no
  live developer portal, documentation, or API surface today.
